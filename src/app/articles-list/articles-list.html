<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">📰 Articles</h1>
    <a routerLink="/new" class="btn btn-primary">+ New Article</a>
    
  </div>

  <p *ngIf="message" class="text-success fw-semibold">{{ message }}</p>

  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let article of articles">
      <div class="card h-100 shadow-sm">

        <!--Thumbnail pic -->
        <a
          *ngIf="article.thumbnail_image"
          [routerLink]="['/article', article.id]">

        <img
          [src]="'data:' + article.thumbnail_media_type + ';base64,' + article.thumbnail_image"
          class="card-img-top"
          style="height: 180px; object-fit: contain;"
          alt="{{ article.title }}">
      </a>

        <div class="card-body d-flex flex-column">
          <span class="badge bg-secondary mb-2 align-self-start">{{ article.category }}</span>

          <!--Title with routerlink-->
          <h5 class="card-title fw-bold">
            <a [routerLink]="['/article', article.id]">
              {{ article.title }}
            </a>
          </h5>

          <h6 class="card-subtitle text-muted mb-2">{{ article.subtitle }}</h6>
            <p class="card-text small" [innerHTML]="article.abstract"></p>
          <div class="d-flex gap-2 mt-auto">
            <a [routerLink]="['/article', article.id]" class="btn btn-sm btn-outline-primary">View</a>
            <a [routerLink]="['/edit', article.id]" class="btn btn-sm btn-outline-secondary">Edit</a>
            <button class="btn btn-sm btn-outline-danger ms-auto" (click)="deleteArticle(article)">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
